# Competitor Radar: a reel counts as an "outlier" when it beats its creator's OWN median views.
radar:
  source: apify            # apify (automatic, pay-as-you-go) | meta (needs Meta app review) | hiker
  reels_per_account: 40
  min_age_hours: 72        # younger reels are still collecting views
  max_age_days: 30         # older topics may be stale
  min_ratio: 5.0           # 5x the creator's median…
  hybrid_ratio: 3.0        # …or 3x, if the reel also has real reach:
  hybrid_min_views: 50000
  abs_floor_views: 20000   # tune after first run: ~ median views of your strongest competitor
  meta_likes:              # Meta's tool gives likes, not views, so these floors are in likes
    hybrid_min_views: 3000
    abs_floor_views: 1000

clips:
  inbox_dir: inbox            # drop your raw clips here
  reel_seconds: 8             # how long each finished reel is
  pick_moment: loudest        # "loudest" = grab the rev / cold start, "start" = from the beginning
  variants_per_clip: 3
  broll: [IMG_8197.MOV]        # clips only used as cut-ins (door / detail shots), never posted alone

look:
  text_style: editorial       # editorial = small thin serif (my style) | stacked = big serif, word per line | classic
  grade: match                # match = copy the colours of my own reels | natural = real colour, slightly dark | moody | none
  text_position: auto         # auto = darkest calm spot inside Instagram's safe zone, or 0.14–0.6
  font: ""                    # leave empty to use the style's font
  font_size: 0                # 0 = the style's size


audio:
  # original = keep the clip's own sound (your engine sounds do great!)
  # music    = replace with a track from the audio/ folder
  # mix      = music + engine sound underneath
  mode: original
  folder: audio
  music_volume: 0.8
  original_volume: 0.35       # only used in "mix"

# review = Claude makes the videos + recommends a trending sound, you OK them before posting.
# autopilot = researches, edits, adds music from your audio folder, schedules and posts by itself.
mode: review

autopilot:
  posts_per_day: 5          # trial reels per day (both modes)
  risky_share: 0            # % of them that are riskier, trend-led reels
  post_times: ["09:00", "12:00", "15:00", "18:00", "21:00"]   # UK time
  max_per_run: 2
  # Things it's allowed to experiment with, and learn from:
  experiment_with: [on_screen_text, post_caption, track, seconds, text_position]

posting:
  backend: graph              # graph = Meta API directly (free) | metricool = via Metricool (paid)
  timezone: Europe/London     # used by Metricool scheduling
  trial_reel: true
  graduation: MANUAL          # MANUAL = you choose in the app, SS_PERFORMANCE = Instagram decides
  require_approval: false     # false = posts automatically, true = you approve first
  max_posts_per_run: 1         # the cloud runs every 3 hours, so 1 per run spaces them out nicely
  minutes_between_posts: 20
  hashtags: ""                # e.g. "#astonmartin #db12" (added to the post caption)
  graph_api_version: v23.0
