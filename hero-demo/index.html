<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-bg: #000;
    --color-surface-1: #111;
    --color-surface-2: #1E1E1E;
    --color-surface-3: #242424;
    --color-text: #fff;
    --color-text-muted: rgba(255,255,255,.6);
    --color-text-subtle: #999;
    --color-accent: #0099FF;
    --border-hairline: 1px solid rgba(255,255,255,.08);
    --radius-md: 8px;
    --radius-xl: 20px;
    --font-display: "Satoshi", "General Sans", "Inter", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
    --ease-out: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Hero copy ---------- */
  .hero { padding: 120px 0 80px; }
  .hero h1 {
    font-family: var(--font-display); font-weight: 500;
    font-size: clamp(36px, 5vw, 56px); line-height: 1; letter-spacing: -.04em;
    max-width: 18ch;
  }
  .hero-actions { display: flex; align-items: center; gap: 10px; margin: 28px 0 40px; flex-wrap: wrap; }
  .btn { font: 500 14px/1 var(--font-body); padding: 10px 14px; border-radius: var(--radius-md); border: 0; cursor: pointer; text-decoration: none; transition: background .15s; }
  .btn-primary { background: #fff; color: #000; }
  .btn-primary:hover { background: #e6e6e6; }
  .btn-secondary { background: var(--color-surface-3); color: #fff; }
  .btn-secondary:hover { background: #2e2e2e; }

  /* ---------- Media card ---------- */
  .media-card {
    position: relative; aspect-ratio: 16 / 9; overflow: hidden;
    border: var(--border-hairline); border-radius: var(--radius-xl); background: #000;
  }
  /* Option A: a real recorded video fills the card */
  .media-card video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .media-card .duration {
    position: absolute; right: 14px; bottom: 12px; z-index: 3;
    font: 500 11px var(--font-body); color: #fff; background: rgba(0,0,0,.5);
    padding: 3px 6px; border-radius: 4px; backdrop-filter: blur(6px);
  }

  /* Option B: live animated demo built in HTML/CSS (used when there's no video) */
  .demo { position: absolute; inset: 0; display: grid; place-items: center; }
  .demo::before { /* blue bloom behind the prompt */
    content: ""; position: absolute; width: 70%; height: 80%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,80,255,.35), transparent 70%);
    filter: blur(20px); animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .6; transform: scale(.94); } }

  .stage { position: relative; width: min(440px, 80%); display: grid; gap: 18px; transition: transform .8s var(--ease-out), opacity .6s; }
  .chat-head { display: flex; gap: 14px; }
  .chat-select { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-radius: 12px; background: rgba(255,255,255,.07); color: #ddd; font-size: 18px; }
  .chat-plus { width: 54px; border-radius: 12px; background: rgba(255,255,255,.07); display: grid; place-items: center; font-size: 22px; color: #bbb; }

  .prompt {
    min-height: 210px; padding: 18px; border-radius: 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: rgba(40,50,110,.25);
    border: 1px solid var(--color-accent);
    box-shadow: 0 0 0 1px rgba(0,153,255,.6), 0 0 24px rgba(0,153,255,.55), 0 0 120px rgba(0,102,255,.35),
                inset 0 0 30px rgba(0,120,255,.15);
  }
  .prompt-text { font-size: 18px; color: #fff; min-height: 3em; line-height: 1.4; }
  .prompt-text.placeholder { color: rgba(255,255,255,.4); }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--color-accent); vertical-align: -3px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .prompt-foot { display: flex; justify-content: space-between; align-items: center; color: rgba(255,255,255,.5); font-size: 15px; border-top: 1px solid rgba(255,255,255,.08); padding-top: 14px; }
  .send { width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,.1); display: grid; place-items: center; transition: background .2s, transform .2s; }
  .send.pressed { background: var(--color-accent); transform: scale(.92); }

  .thinking { font-size: 14px; color: transparent; background: linear-gradient(90deg, #555 0%, #fff 50%, #555 100%) 0 0/200% 100%; -webkit-background-clip: text; background-clip: text; animation: shimmer 1.4s linear infinite; opacity: 0; transition: opacity .3s; }
  .thinking.on { opacity: 1; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* Generated "site" that builds itself after the prompt */
  .result { position: absolute; inset: 8% 10%; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto 1fr 1fr; gap: 12px; pointer-events: none; }
  .result > * { background: var(--color-surface-2); border: var(--border-hairline); border-radius: 12px; opacity: 0; transform: translateY(16px) scale(.98); transition: opacity .6s var(--ease-out), transform .6s var(--ease-out); }
  .result.on > * { opacity: 1; transform: none; }
  .r-nav { grid-column: 1 / -1; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .r-nav i { width: 40px; height: 6px; border-radius: 3px; background: #333; }
  .r-nav i:first-child { width: 18px; height: 18px; border-radius: 5px; background: var(--color-accent); }
  .r-hero { grid-column: 1 / 3; padding: 22px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; background: linear-gradient(135deg, #0a1a3a, #0b0b0b 70%); }
  .r-hero b { display: block; height: 14px; width: 70%; border-radius: 4px; background: #fff; }
  .r-hero b + b { width: 45%; }
  .r-hero span { width: 70px; height: 22px; border-radius: 6px; background: #fff; margin-top: 8px; }
  .r-card { padding: 14px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; }
  .r-card b { height: 8px; width: 60%; border-radius: 3px; background: #444; }
  .r-card::before { content: ""; flex: 1; border-radius: 8px; background: linear-gradient(160deg, #13345e, #0a0a0a); margin-bottom: 8px; }
  .r-stat { padding: 16px; font: 600 28px var(--font-body); color: var(--color-accent); display: flex; flex-direction: column; justify-content: flex-end; }
  .r-stat small { font: 400 11px var(--font-body); color: var(--color-text-subtle); }

  .demo.building .stage { transform: translateY(40%) scale(.7); opacity: 0; }

  @media (max-width: 700px) {
    .hero { padding: 72px 0 48px; }
    .media-card { aspect-ratio: 4 / 5; }
    .chat-select { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="container">
      <h1>Your product headline goes right here</h1>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#">Get started for free</a>
        <a class="btn btn-secondary" href="#">See how it works</a>
      </div>

      <div class="media-card">
        <!--
          OPTION A: a recorded demo video. Uncomment, point src at your file, and delete the .demo block below.
          <video autoplay muted loop playsinline preload="metadata" poster="/media/hero-poster.jpg">
            <source src="/media/hero-demo.webm" type="video/webm">
            <source src="/media/hero-demo.mp4"  type="video/mp4">
          </video>
          <span class="duration">0:36</span>
        -->

        <!-- OPTION B: live animated demo (no video file needed) -->
        <div class="demo" id="demo" aria-label="Animated product demo">
          <div class="stage">
            <div class="chat-head">
              <div class="chat-select">New Chat <span>⌄</span></div>
              <div class="chat-plus">+</div>
            </div>
            <div class="prompt">
              <div class="prompt-text placeholder" id="promptText">Ask anything…</div>
              <div class="thinking" id="thinking">Thinking…</div>
              <div class="prompt-foot">
                <span>Your product ⌄</span>
                <span class="send" id="send">↑</span>
              </div>
            </div>
          </div>
          <div class="result" id="result">
            <div class="r-nav"><i></i><i></i><i></i><i></i></div>
            <div class="r-hero"><b></b><b></b><span></span></div>
            <div class="r-stat">99.9%<small>Uptime</small></div>
            <div class="r-card"><b></b></div>
            <div class="r-card"><b></b></div>
            <div class="r-card"><b></b></div>
          </div>
        </div>
      </div>
    </div>
  </section>

<script>
  // Loops: type a prompt -> press send -> "Thinking…" -> the generated layout builds -> reset.
  // Edit PROMPTS to show what your product does.
  const PROMPTS = [
    "Build me a landing page for a coffee brand",
    "Add a pricing section with three tiers",
    "Make the hero darker with a blue glow",
  ];
  const $ = id => document.getElementById(id);
  const demo = $("demo"), text = $("promptText"), send = $("send"), thinking = $("thinking"), result = $("result");
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  async function run(prompt) {
    text.classList.remove("placeholder");
    text.innerHTML = '<span></span><i class="caret"></i>';
    const out = text.firstChild;
    for (const ch of prompt) { out.textContent += ch; await wait(reduced ? 0 : 45 + Math.random() * 40); }
    await wait(500);
    send.classList.add("pressed"); await wait(250); send.classList.remove("pressed");
    thinking.classList.add("on"); await wait(1600); thinking.classList.remove("on");
    demo.classList.add("building");
    [...result.children].forEach((el, i) => el.style.transitionDelay = `${i * 120}ms`);
    result.classList.add("on");
    await wait(3800);
    result.classList.remove("on");
    [...result.children].forEach(el => el.style.transitionDelay = "0ms");
    await wait(500);
    demo.classList.remove("building");
    text.classList.add("placeholder"); text.textContent = "Ask anything…";
    await wait(1200);
  }

  // Only animate while the card is on screen (saves CPU/battery).
  let visible = false, running = false;
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; if (visible && !running) loop(); }).observe(demo);
  async function loop() {
    running = true;
    for (let i = 0; visible; i = (i + 1) % PROMPTS.length) await run(PROMPTS[i]);
    running = false;
  }
</script>
</body>
</html>
